basePath: /api/v1
definitions:
  gin.H:
    additionalProperties: {}
    type: object
  libratrack_internal_model.AuthResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
      user:
        $ref: '#/definitions/libratrack_internal_model.User'
    type: object
  libratrack_internal_model.Author:
    properties:
      bio:
        type: string
      created_at:
        type: string
      full_name:
        type: string
      id:
        type: integer
      updated_at:
        type: string
    type: object
  libratrack_internal_model.Book:
    properties:
      authors:
        items:
          $ref: '#/definitions/libratrack_internal_model.Author'
        type: array
      category:
        $ref: '#/definitions/libratrack_internal_model.Category'
      category_id:
        type: integer
      copies:
        items:
          $ref: '#/definitions/libratrack_internal_model.Copy'
        type: array
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      isbn:
        type: string
      published_year:
        type: integer
      publisher:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  libratrack_internal_model.Category:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  libratrack_internal_model.Copy:
    properties:
      barcode:
        type: string
      book:
        allOf:
        - $ref: '#/definitions/libratrack_internal_model.Book'
        description: Book and Book.Copies must never be preloaded together (JSON cycle).
      book_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      inventory_no:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  libratrack_internal_model.CreateBookRequest:
    properties:
      author_ids:
        items:
          type: integer
        minItems: 1
        type: array
      category_id:
        type: integer
      description:
        maxLength: 5000
        type: string
      isbn:
        maxLength: 20
        minLength: 10
        type: string
      published_year:
        maximum: 2100
        minimum: 0
        type: integer
      publisher:
        maxLength: 255
        type: string
      title:
        maxLength: 255
        type: string
    required:
    - author_ids
    - category_id
    - isbn
    - title
    type: object
  libratrack_internal_model.Loan:
    properties:
      borrowed_at:
        type: string
      copy:
        $ref: '#/definitions/libratrack_internal_model.Copy'
      copy_id:
        type: integer
      due_at:
        type: string
      fine_amount:
        description: FineAmount is whole UAH. Money is an integer, never a float.
        type: integer
      id:
        type: integer
      returned_at:
        type: string
      user:
        $ref: '#/definitions/libratrack_internal_model.User'
      user_id:
        type: integer
    type: object
  libratrack_internal_model.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  libratrack_internal_model.RegisterRequest:
    properties:
      email:
        maxLength: 255
        type: string
      full_name:
        maxLength: 255
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  libratrack_internal_model.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      role:
        type: string
      updated_at:
        type: string
    type: object
info:
  contact: {}
  description: REST API for a library catalog.
  title: Libratrack API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/libratrack_internal_model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/libratrack_internal_model.AuthResponse'
      summary: Login user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Register request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/libratrack_internal_model.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/libratrack_internal_model.User'
      summary: Register a new user
      tags:
      - auth
  /books:
    post:
      consumes:
      - application/json
      parameters:
      - description: Book request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/libratrack_internal_model.CreateBookRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/libratrack_internal_model.Book'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/gin.H'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gin.H'
      security:
      - BearerAuth: []
      summary: Create a new book
      tags:
      - books
  /books/{id}:
    get:
      consumes:
      - application/json
      parameters:
      - description: Book ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/libratrack_internal_model.Book'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/gin.H'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gin.H'
      security:
      - BearerAuth: []
      summary: Get a book by ID
      tags:
      - books
  /loans:
    get:
      consumes:
      - application/json
      description: Get a list of all book loans
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/libratrack_internal_model.Loan'
            type: array
      security:
      - BearerAuth: []
      summary: List loans
      tags:
      - loans
  /me:
    get:
      responses: {}
      security:
      - BearerAuth: []
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
