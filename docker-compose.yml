version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: libratrack-db
    environment:
      POSTGRES_USER: libratrack
      POSTGRES_PASSWORD: libratrack
      POSTGRES_DB: libratrack
    ports:
      - "5432:5432"
    volumes:
      - libratrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libratrack -d libratrack"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  libratrack_pgdata:
