{{define "content"}}
<h1 class="page-title">Користувачі</h1>
<p><a class="btn btn-primary" href="/panel/new-user">Додати користувача</a></p>
<table class="data">
  <thead><tr><th>Ім'я</th><th>Email</th><th>Роль</th><th>Статус</th><th>Дії</th></tr></thead>
  <tbody>
    {{range .Data.Users}}
    <tr>
      <td>{{.FullName}}</td>
      <td>{{.Email}}</td>
      <td>
        <form method="post" action="/panel/users/{{.ID}}/role" class="inline-form">
          <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
          <select name="role" aria-label="Роль">
            <option value="admin"{{if eq .Role "admin"}} selected{{end}}>Адміністратор</option>
            <option value="librarian"{{if eq .Role "librarian"}} selected{{end}}>Бібліотекар</option>
            <option value="reader"{{if eq .Role "reader"}} selected{{end}}>Читач</option>
          </select>
          <button type="submit" class="btn btn-secondary btn-small">Зберегти</button>
        </form>
      </td>
      <td>{{if .Disabled}}Вимкнений{{else}}Активний{{end}}</td>
      <td>
        <a class="btn btn-secondary btn-small" href="/panel/users/{{.ID}}/edit">Редагувати</a>
        <form method="post" action="/panel/users/{{.ID}}/disable" class="inline-form">
          <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
          <input type="hidden" name="disabled" value="{{if .Disabled}}0{{else}}1{{end}}">
          <button type="submit" class="btn btn-secondary btn-small">{{if .Disabled}}Увімкнути{{else}}Вимкнути{{end}}</button>
        </form>
        <form method="post" action="/panel/users/{{.ID}}/delete" class="inline-form">
          <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
          <button type="submit" class="btn btn-danger btn-small">Видалити</button>
        </form>
      </td>
    </tr>
    {{end}}
  </tbody>
</table>
{{template "pagination" .Data.Pager}}
{{end}}
